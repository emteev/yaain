name: Daily feed update

on:
  schedule:
    - cron: "0 12 * * *"   # noon UTC = 8am ET
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r yaain/requirements.txt

      - name: Run YAAIN pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEED_PATH: feed.xml
          STATE_PATH: yaain/seen.json
        run: python yaain/main.py

      - name: Commit updated feed and state
        run: |
          git config user.name "yaain-bot"
          git config user.email "actions@github.com"
          git add feed.xml yaain/seen.json
          git diff --cached --quiet || git commit -m "chore: daily feed update $(date -u +%Y-%m-%d)"
          git push
