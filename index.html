<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAAIN — stack signal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    font-size: 15px;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  /* Masthead */
  .masthead {
    border-bottom: 1.5px solid #1a1a18;
    padding-bottom: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.4rem;
  }
  .wordmark {
    font-size: 11px; font-weight: 600; letter-spacing: 0.15em;
    text-transform: uppercase; color: #5f5e5a;
  }
  .issue-date { font-size: 11px; color: #888780; letter-spacing: 0.05em; }
  .masthead h1 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15;
  }
  .masthead .tagline { margin-top: 0.4rem; font-size: 13px; color: #5f5e5a; }

  /* Pills */
  .source-pill {
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    padding: 2px 8px; border-radius: 100px; white-space: nowrap;
  }
  .pill-latent    { background: #EEEDFE; color: #3C3489; }
  .pill-anthropic { background: #E1F5EE; color: #085041; }
  .pill-release   { background: #FAEEDA; color: #633806; }
  .pill-changelog { background: #E6F1FB; color: #0C447C; }
  .pill-code      { background: #FAECE7; color: #712B13; }
  .pill-external  { background: #F1EFE8; color: #444441; }
  .pill-news      { background: #FBEAF0; color: #72243E; }

  .item-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-date { font-size: 11px; color: #888780; }

  /* Tier 1: hero */
  .tier-1 {
    border-top: 1.5px solid #1a1a18;
    border-bottom: 1.5px solid #1a1a18;
    padding: 2.5rem 0;
    margin-bottom: 3rem;
  }
  .tier-1-content {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2.5rem;
    align-items: start;
  }
  .tier-1-text .item-meta { margin-bottom: 1rem; }
  .tier-1 h2 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
  }
  .tier-1 .lede {
    font-size: 18px;
    line-height: 1.55;
    color: #2c2c28;
    max-width: 720px;
  }
  .tier-1 .lede p + p { margin-top: 0.9rem; }
  .tier-1 .byline {
    margin-top: 1.25rem;
    font-size: 12px;
    color: #5f5e5a;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tier-1-image {
    width: 280px;
    height: 280px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 4px;
    background: #e8e7e3;
  }
  .tier-1-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  @media (max-width: 900px) {
    .tier-1-content {
      grid-template-columns: 1fr;
    }
    .tier-1-image {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
    }
  }

  /* Section labels */
  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: #888780;
    margin: 2.5rem 0 1.25rem;
    padding-bottom: 0.5rem;
  }

  /* Tier 2: featured 2-col */
  .tier-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2.5rem;
    margin-bottom: 2.5rem;
  }
  .tier-2 .item {
    padding: 0.75rem; margin: -0.75rem;
  }
  .tier-2 h3 {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0.75rem 0;
  }
  .tier-2 p { font-size: 14px; color: #444441; }

  /* Tier 3: more 4-col */
  .tier-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 2rem;
    margin-bottom: 2.5rem;
  }
  .tier-3 .item {
    padding: 0.5rem; margin: -0.5rem;
  }
  .tier-3 h4 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.005em;
    margin: 0.5rem 0;
  }
  .tier-3 p {
    font-size: 13px;
    color: #5f5e5a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Tier 4: briefs (bulleted line) */
  .tier-4 {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .item-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: baseline;
    padding: 0.75rem; margin: -0.75rem;
    font-size: 14px;
  }
  .item-row a {
    font-weight: 500;
    flex: 1;
    min-width: 300px;
  }
  .item-row .dot { color: #ccc; }
  .item-row .pub { font-size: 11px; color: #888780; white-space: nowrap; }
  .item-row .date { font-size: 11px; color: #888780; white-space: nowrap; }

  /* Verdict groups — the page's spine. The question each group answers is
     printed above it, because "act" only means something if you say so. */
  .vgroup { margin-bottom: 3rem; }
  .vhead {
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    border-bottom: 1.5px solid #1a1a18;
    padding-bottom: 0.5rem; margin-bottom: 1.25rem;
  }
  .vhead h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
  .vhead .vq { font-size: 12px; color: #5f5e5a; }
  .vhead .vcount { font-size: 11px; color: #888780; margin-left: auto; }
  .vgroup-act  .vhead { border-bottom-color: #9A2C13; }
  .vgroup-act  .vhead h2 { color: #9A2C13; }
  .vgroup-watch .vhead h2 { color: #633806; }

  /* Stack badge — the whole point of the redesign: what does this touch? */
  .stack-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 2px 8px; border-radius: 3px;
    background: #1a1a18; color: #f5f4f0; white-space: nowrap;
  }
  .vgroup-act .stack-badge { background: #9A2C13; }

  .rated { font-size: 11px; color: #888780; }

  .placeholder {
    color: #888780;
    padding: 2rem 0;
    text-align: center;
  }
</style>
</head>
<body>

<div class="page">
  <div class="masthead">
    <div class="masthead-top">
      <div class="wordmark">yet another ai newsletter</div>
      <div class="issue-date" id="issue-date"></div>
    </div>
    <h1>Y A A I N</h1>
    <p class="tagline">What changed that affects something we run. Filtered against <a href="https://github.com/emteev/yaain/blob/main/yaain/stack.json" target="_blank" rel="noopener"><code>stack.json</code></a>.</p>
  </div>

  <div id="content"></div>
</div>

<script>
  const REFRESH_MS = 5 * 60 * 1000;  // 5 minutes

  // ── Verdict groups ────────────────────────────────────────────────────
  // The page is organised by what the item DEMANDS, not by who published it.
  const GROUPS = [
    { key: "act",     title: "Act on this",   q: "Something we run has changed." },
    { key: "watch",   title: "Worth watching", q: "We could run this, and might want to." },
    { key: "context", title: "Context",        q: "Background worth having. Nothing to do." },
  ];

  // Pills are only a visual cue for where an item came from; a source with no
  // entry falls back to neutral rather than disappearing.
  const PILL_BY_PREFIX = [
    ["HF — ",            "latent"],
    ["Anthropic",        "anthropic"],
    ["Claude",           "code"],
    ["Hacker News",      "external"],
    ["Ollama",           "release"],
    ["ComfyUI",          "release"],
    ["llama.cpp",        "release"],
    ["transformers",     "release"],
    ["Hermes",           "release"],
    ["trellis",          "release"],
    ["Phoronix",         "news"],
    ["TechPowerUp",      "news"],
    ["ServeTheHome",     "news"],
  ];
  function pillClass(source) {
    for (const [prefix, cls] of PILL_BY_PREFIX) {
      if (source.startsWith(prefix)) return cls;
    }
    return "external";
  }

  // ── Fetch helpers ──────────────────────────────────────────────────────
  function bust(url) { return url + "?t=" + Date.now(); }
  async function fetchText(url) {
    const r = await fetch(bust(url), { cache: "no-store" });
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.text();
  }
  async function fetchJSON(url, fallback) {
    try { return JSON.parse(await fetchText(url)); }
    catch { return fallback; }
  }

  function parseFeed(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    const items = [];
    for (const el of doc.querySelectorAll("item")) {
      const url = el.querySelector("link")?.textContent?.trim() || "";
      if (!url) continue;
      // Verdict and affected stack item ride as RSS <category domain="...">.
      let verdict = "", affects = "";
      for (const cat of el.querySelectorAll("category")) {
        const d = cat.getAttribute("domain");
        if (d === "verdict") verdict = cat.textContent.trim();
        else if (d === "stack") affects = cat.textContent.trim();
      }
      items.push({
        url,
        title: el.querySelector("title")?.textContent?.trim() || "",
        description: el.querySelector("description")?.textContent?.trim() || "",
        published: el.querySelector("pubDate")?.textContent?.trim() || "",
        source: el.querySelector("source")?.textContent?.trim() || "",
        image: el.querySelector("image")?.textContent?.trim() || "",
        verdict, affects,
      });
    }
    return items;
  }

  // feed.py joins summary + why with a single space; split them back out.
  function splitDescription(desc) {
    if (!desc) return { summary: "", why: "" };
    const m = desc.match(/^(.+?[.!?])\s+([A-Z].*)$/s);
    if (m) return { summary: m[1].trim(), why: m[2].trim() };
    return { summary: desc.trim(), why: "" };
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function pill(source) {
    return `<span class="source-pill pill-${pillClass(source)}">${escapeHtml(source)}</span>`;
  }
  function stackBadge(affects) {
    return affects ? `<span class="stack-badge">${escapeHtml(affects)}</span>` : "";
  }

  // ── Renderers ─────────────────────────────────────────────────────────
  // `act` gets the full treatment; watch and context get progressively less.
  function renderAct(items) {
    return items.map(item => {
      const { summary, why } = splitDescription(item.description);
      const image = item.image
        ? `<div class="tier-1-image"><img src="${escapeHtml(item.image)}" alt="" loading="lazy"></div>` : "";
      return `
        <div class="tier-1">
          <div class="tier-1-content">
            <div class="tier-1-text">
              <div class="item-meta">
                ${stackBadge(item.affects)}
                ${pill(item.source)}
                <span class="item-date">${formatDate(item.published)}</span>
                ${ratedTag(item)}
              </div>
              <h2><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h2>
              <div class="lede">${summary ? `<p>${escapeHtml(summary)}</p>` : ""}${why ? `<p>${escapeHtml(why)}</p>` : ""}</div>
            </div>
            ${image}
          </div>
        </div>`;
    }).join("");
  }

  function renderWatch(items) {
    const cards = items.map(item => {
      const { summary, why } = splitDescription(item.description);
      return `
        <div class="item">
          <div class="item-meta">
            ${stackBadge(item.affects)}
            ${pill(item.source)}
            <span class="item-date">${formatDate(item.published)}</span>
            ${ratedTag(item)}
          </div>
          <h3><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
          <p>${escapeHtml(summary)}${why ? " " + escapeHtml(why) : ""}</p>
        </div>`;
    }).join("");
    return `<div class="tier-2">${cards}</div>`;
  }

  function renderContext(items) {
    const rows = items.map(item => `
      <div class="item-row">
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
        <span class="dot">·</span>
        <span class="pub">${escapeHtml(item.source)}</span>
        <span class="dot">·</span>
        <span class="date">${formatDate(item.published)}</span>
      </div>`).join("");
    return `<div class="tier-4">${rows}</div>`;
  }

  function ratedTag(item) {
    return item.rating ? `<span class="rated">rated ${item.rating}</span>` : "";
  }

  // ── Pipeline ──────────────────────────────────────────────────────────
  //
  // ⚠️ THE CHANGE THAT MATTERS. The old page rendered ONLY items a human had
  // already rated 1–4, so an unrated item was invisible and the homepage
  // showed nothing until Em worked through the ranker. Now the MACHINE's
  // verdict lays the page out and the human rating is an overlay on top:
  //   rating 5 / blocklist → hidden (the human's veto, unchanged)
  //   rating 1–4           → sorts to the top of its group
  //   unrated              → still shown, in its machine tier
  // The ranker keeps its meaning; it stops being a precondition for the page
  // existing at all.
  function sortKey(a, b) {
    const ra = a.rating || 99, rb = b.rating || 99;   // rated first, best first
    if (ra !== rb) return ra - rb;
    return new Date(b.published) - new Date(a.published);
  }

  async function load() {
    document.getElementById("issue-date").textContent =
      new Date().toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short", year: "numeric" });

    const target = document.getElementById("content");
    let xml;
    try {
      xml = await fetchText("feed.xml");
    } catch (e) {
      target.innerHTML = `<div class="placeholder">No feed yet. The pipeline publishes here every four hours.</div>`;
      return;
    }
    const ratings = await fetchJSON("ratings.json", {});
    const blocklist = new Set(await fetchJSON("blocklist.json", []));

    const buckets = { act: [], watch: [], context: [] };
    let hidden = 0, untiered = 0;
    for (const item of parseFeed(xml)) {
      if (blocklist.has(item.url)) { hidden++; continue; }
      const r = ratings[item.url];
      if (r === 5) { hidden++; continue; }
      item.rating = (r >= 1 && r <= 4) ? r : 0;
      // Items published before the stack-driven filter existed carry no
      // verdict. Show them as context rather than dropping them silently.
      const v = buckets[item.verdict] ? item.verdict : (untiered++, "context");
      buckets[v].push(item);
    }

    const parts = [];
    for (const g of GROUPS) {
      const list = buckets[g.key].sort(sortKey);
      if (!list.length) continue;
      const body = g.key === "act" ? renderAct(list)
                 : g.key === "watch" ? renderWatch(list)
                 : renderContext(list);
      parts.push(`
        <div class="vgroup vgroup-${g.key}">
          <div class="vhead">
            <h2>${g.title}</h2>
            <span class="vq">${g.q}</span>
            <span class="vcount">${list.length}</span>
          </div>
          ${body}
        </div>`);
    }

    if (!parts.length) {
      target.innerHTML = `<div class="placeholder">Nothing in the feed yet. The pipeline publishes here every four hours.</div>`;
      return;
    }
    if (hidden) {
      parts.push(`<div class="placeholder">${hidden} item${hidden === 1 ? "" : "s"} hidden by the ranker.</div>`);
    }
    target.innerHTML = parts.join("");
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
